name: Continuous Integration

on:
  push:
      branches:
          - main
  pull_request:

jobs:

  test-plugin:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        aiida-version:
          - '2.4.3'
          - '2.5.1'

    timeout-minutes: 30

    steps:

    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        load: true
        tags: aiida_cp2k_test
        cache-from: type=gha,scope=aiida-${{ matrix.aiida-version }}
        cache-to: type=gha,mode=max,scope=aiida-${{ matrix.aiida-version }}
        build-args: |
          AIIDA_VERSION=${{ matrix.aiida-version }}

    - name: Create container from aiida_cp2k_test image and test the plugin inside
      run: |
        export DOCKERID=`docker run -d aiida_cp2k_test`
        sleep 5
        docker logs $DOCKERID
        docker exec --tty --user aiida $DOCKERID /bin/bash -l -c 'cd /home/aiida/aiida-cp2k/ && py.test --cov aiida_cp2k --cov-append .'


  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [3.11]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install python dependencies
      run: |
        pip install --upgrade pip
        pip install -e .[docs,dev]

    - name: Build docs
      run: cd docs && make
